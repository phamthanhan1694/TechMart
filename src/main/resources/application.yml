spring:
  application:
    name: techmart-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/techmart}
    username: ${SPRING_DATASOURCE_USERNAME:techmart}
    password: ${SPRING_DATASOURCE_PASSWORD:techmart}
    hikari:
      maximum-pool-size: 20
      # Giu ngan de phat hien som transaction bi keo dai (xem docs/06-nfr-va-load-test.md muc 4)
      connection-timeout: 5000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false          # tat: khong de session song toi tan tang view, buoc nap du lieu dung cho
    hibernate:
      ddl-auto: validate         # schema do Flyway quan ly, Hibernate chi kiem tra
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  error:
    # Khong bao gio lo chi tiet noi bo ra response (docs/07-security-checklist.md muc 4)
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

app:
  jwt:
    secret: ${APP_JWT_SECRET:doi-chuoi-nay-truoc-khi-deploy-toi-thieu-32-ky-tu-that-dai}
    access-ttl: ${APP_JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${APP_JWT_REFRESH_TTL:P7D}
    issuer: techmart
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  inventory:
    reservation-ttl: PT10M
    release-job-batch-size: 500
  payment:
    webhook-secret: ${APP_PAYMENT_WEBHOOK_SECRET:mock-webhook-secret-doi-truoc-khi-deploy}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  cache:
    # Tat duoc bang bien moi truong de do hieu nang truoc/sau khi co cache
    products-enabled: ${APP_CACHE_PRODUCTS_ENABLED:true}
    list-ttl: PT60S
    detail-ttl: PT10M

management:
  endpoints:
    web:
      exposure:
        # Chi mo health + prometheus. /env va /heapdump lo secret.
        include: health,prometheus,info
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: techmart
    # Bat histogram de Prometheus tinh duoc p95/p99. Khong bat thi chi co count/sum
    # va moi truy van phan vi deu tra ve rong.
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    dev.techmart: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    properties:
      hibernate:
        generate_statistics: true    # de dem so query trong test chong N+1
logging:
  level:
    dev.techmart: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

---
spring:
  config:
    activate:
      on-profile: demo
app:
  seed:
    enabled: true

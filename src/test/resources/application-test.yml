spring:
  datasource:
    hikari:
      # Phai LON HON so thread cua concurrency test (32). Neu nho hon, thread thua se
      # timeout khi xin connection va bai test do nham "khong ban duoc" thanh "het hang" -
      # che mat chinh cai dang can do. Day la gioi han cua moi truong test, khong phai
      # cua he thong.
      maximum-pool-size: 40
      connection-timeout: 30000
  jpa:
    hibernate:
      # Van la validate: test phai kiem duoc entity co khop schema Flyway khong.
      # Doi sang create-drop la mat luon gia tri kiem tra do.
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: true   # de dem so query trong test chong N+1
  flyway:
    enabled: true
    clean-disabled: false

app:
  jwt:
    secret: test-secret-chi-dung-trong-test-toi-thieu-32-ky-tu-that-dai
    access-ttl: PT15M
    refresh-ttl: P7D
    issuer: techmart-test
  seed:
    enabled: false
  inventory:
    reservation-ttl: PT10M
    release-job-batch-size: 500
  payment:
    webhook-secret: test-webhook-secret
  cors:
    allowed-origins: http://localhost:3000

logging:
  level:
    dev.techmart: INFO
    org.testcontainers: WARN
    com.github.dockerjava: WARN

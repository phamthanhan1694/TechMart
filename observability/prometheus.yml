global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: techmart
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
        labels:
          application: techmart

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

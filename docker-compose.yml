services:
  postgres:
    image: postgres:16-alpine
    container_name: techmart-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-techmart}
      POSTGRES_USER: ${POSTGRES_USER:-techmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techmart}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techmart} -d ${POSTGRES_DB:-techmart}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: techmart-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: ./backend
    container_name: techmart-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-techmart}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-techmart}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-techmart}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_JWT_SECRET: ${JWT_SECRET:-doi-chuoi-nay-truoc-khi-deploy-toi-thieu-32-ky-tu-that-dai}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-mock-webhook-secret-doi-truoc-khi-deploy}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build: ./frontend
    container_name: techmart-web
    depends_on:
      app:
        condition: service_healthy
    environment:
      # Browser goi /api/... roi server Next proxy sang backend qua mang noi bo
      # cua compose. Khong di qua CORS, va khong lo dia chi backend ra ngoai.
      BACKEND_URL: http://app:8080
    ports:
      - "3000:3000"
    healthcheck:
      # 127.0.0.1 chu khong phai localhost: server Next nghe 0.0.0.0 (chi IPv4),
      # con busybox wget phan giai localhost ra ::1 truoc roi bao Connection refused.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- Observability: chay bang `docker compose --profile observability up -d` ---
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: techmart-prometheus
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: techmart-grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      # 3000 da danh cho frontend, nen Grafana ra 3001
      - "3001:3000"

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
